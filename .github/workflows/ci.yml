name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CI: 'true'
      DATABASE_URL: postgresql://ai_world:ai_world@127.0.0.1:5432/ai_world

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: ai_world
          POSTGRES_PASSWORD: ai_world
          POSTGRES_DB: ai_world
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_world -d ai_world"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Apply database migrations
        run: pnpm --filter @ai-world/foundation-database run prisma:migrate:deploy

      - name: Run database integration tests
        run: pnpm run test:integration

      - name: Run browser E2E tests
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: 'true'
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

      - name: Check architecture
        run: pnpm run architecture:check
